name: SleepQuiz CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: ESLint check
        run: npm run lint

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Verify build output
        run: |
          if [ -d ".next" ]; then
            echo "Build output .next/ generated"
            du -sh .next/
          else
            echo "Build output .next/ not generated"
            exit 1
          fi

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          DATE=$(date +'%Y%m%d')
          COUNT=$(git rev-list --count HEAD)
          echo "version=v1.0.${COUNT}-${DATE}" >> $GITHUB_OUTPUT
          echo "tag=v1.0.${COUNT}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          echo "# SleepQuiz ${{ steps.version.outputs.version }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Tech Stack" >> CHANGELOG.md
          echo "- Next.js 16 + React 19" >> CHANGELOG.md
          echo "- TypeScript + Tailwind CSS 4" >> CHANGELOG.md
          echo "- Supabase + next-intl" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Stats" >> CHANGELOG.md
          echo "- .tsx/.ts files: $(find src -name '*.tsx' -o -name '*.ts' 2>/dev/null | wc -l)" >> CHANGELOG.md
          echo "- Lines of code: $(find src -name '*.tsx' -o -name '*.ts' -exec cat {} + 2>/dev/null | wc -l)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Commits" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --oneline -20 >> CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}